name: ecommerce_front
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # State & Architecture
  provider: ^6.1.1
  go_router: ^14.0.0

  # Media & Hardware
  image_picker: ^1.1.2
  share_plus: ^10.0.0

  # Networking & Security
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0

  # UI, Images & Icons
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  badges: ^3.1.2
  shimmer: ^3.0.0

  # Utilities & Storage
  intl: ^0.19.0
  json_annotation: ^4.9.0
  dio_cache_interceptor: ^3.5.1
  path_provider: ^2.1.5
  http_cache_hive_store: ^5.0.1

  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geocoding: ^3.0.0
  geolocator: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

dependency_overrides:
  geolocator_android: 4.6.1

flutter:
  uses-material-design: true

  # Assets Declaration
  assets:
    - assets/aba/